# Runs daily and can also be started by hand from the Actions tab.
name: Word of the Day

on:
  schedule:
    # 11:00 UTC daily. That is 6:00 AM US Central in summer (daylight saving)
    # and 5:00 AM in winter. Edit the numbers below to change the time. The
    # five fields are: minute hour day-of-month month day-of-week, all in UTC.
    - cron: "0 11 * * *"
  # Lets you run it by hand from the Actions tab. Tick the box to only inspect
  # the RSS feed (no task is created) instead of doing the full run.
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        default: normal
        options:
          - normal        # make the audio and create the Todoist task
          - check-feed    # only look at the RSS feed, create nothing
          - rate-test     # compare reading speeds, create nothing
          - voice-test    # render samples of each voice, create nothing

jobs:
  word-of-the-day:
    runs-on: ubuntu-latest
    # Needed so the job can commit each day's episode back into the repository,
    # which is what GitHub Pages then serves to podcast apps.
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Always work from main, whatever branch triggered this. Scheduled
          # runs otherwise use the repository's default branch, so if that ever
          # points somewhere stale the morning job would quietly run old code
          # and publish to a branch GitHub Pages does not serve.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run
        env:
          TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
          TODOIST_PROJECT_ID: ${{ secrets.TODOIST_PROJECT_ID }}
          # Newer-generation voice. Phrases the short poetic lines of
          # lectionary text far more naturally than the older en-US-GuyNeural,
          # which inserted a mechanical pause at every line break.
          VOICE: en-US-AndrewNeural
          # Natural pace. Podcast apps have their own speed control, so the
          # listener chooses rather than having it baked into the file.
          SPEECH_RATE: "+0%"
          LOCAL_TZ: America/Chicago
          # Where the published episodes and feed will live. Setting this is
          # what switches on podcast mode.
          SITE_URL: https://andrewbrain13-spec.github.io/Daily-readings
          # The morning task links straight into the Spotify app. Not a secret;
          # it is the public address of the show.
          SHOW_LINK: https://open.spotify.com/show/0340g4OVEM6jTEcu4fsMBs
          # Spotify sends its verification code here. This is not kept secret
          # because the feed publishes it anyway; that is how podcast feeds
          # prove ownership. Change it here if the address ever changes.
          PODCAST_EMAIL: Andrew.brain13@gmail.com
          # The show name Spotify displays. Spotify has no setting for this;
          # it mirrors whatever the feed says, so this is where it changes.
          PODCAST_TITLE: Daily Readings and Words from the Pope
        run: |
          case "${{ inputs.mode }}" in
            check-feed) python word_of_the_day.py --check-feed ;;
            rate-test)  python word_of_the_day.py --rate-test ;;
            voice-test) python word_of_the_day.py --voice-test ;;
            *)          python word_of_the_day.py ;;
          esac

      - name: Publish the episode and feed
        # Only on a real run. The diagnostic modes write nothing to publish.
        if: inputs.mode == '' || inputs.mode == 'normal' || inputs.mode == 'voice-test'
        run: |
          if [ -z "$(git status --porcelain docs)" ]; then
            echo "Nothing new to publish."
            exit 0
          fi
          git config user.name "word-of-the-day bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Publish episode for $(date -u +%Y-%m-%d)"
          # The scheduled job and a hand-started one can overlap, so rebase on
          # whatever landed first rather than failing the run.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Published to main."
              exit 0
            fi
            echo "Push rejected, rebasing and retrying ($attempt of 3)."
            git fetch origin main && git rebase origin/main || true
          done
          echo "Could not publish after 3 attempts." >&2
          exit 1
