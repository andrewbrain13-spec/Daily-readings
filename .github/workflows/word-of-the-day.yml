name: Word of the Day

on:
  schedule:
    # 11:00 UTC daily. That is 6:00 AM US Central in summer (daylight saving)
    # and 5:00 AM in winter. Edit the numbers below to change the time. The
    # five fields are: minute hour day-of-month month day-of-week, all in UTC.
    - cron: "0 11 * * *"
  # Lets you run it by hand from the Actions tab. Tick the box to only inspect
  # the RSS feed (no task is created) instead of doing the full run.
  workflow_dispatch:
    inputs:
      check_feed:
        description: "Check the RSS feed only, do not create a task"
        type: boolean
        default: false

jobs:
  word-of-the-day:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run
        env:
          TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
          TODOIST_PROJECT_ID: ${{ secrets.TODOIST_PROJECT_ID }}
          # Optional overrides. Change the voice or speed here if you like.
          VOICE: en-US-GuyNeural
          SPEECH_RATE: "+0%"
          LOCAL_TZ: America/Chicago
        run: |
          if [ "${{ inputs.check_feed }}" = "true" ]; then
            python word_of_the_day.py --check-feed
          else
            python word_of_the_day.py
          fi
